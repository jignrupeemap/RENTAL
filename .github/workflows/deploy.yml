# Deploys to the Hostinger VPS after every push to main.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     the VPS IP address or hostname
#   VPS_USER     the deploy user (e.g. deploy)
#   VPS_SSH_KEY  the private key whose public half is in that user's ~/.ssh/authorized_keys
# Optional: VPS_PORT (default 22).
# Until VPS_HOST is set, the job is skipped instead of failing.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST secret not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deploy script on the VPS
        if: steps.cfg.outputs.ready == 'true'
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "bash /var/www/rental/server/deploy/deploy.sh main"
