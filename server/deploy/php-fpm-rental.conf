; PHP-FPM pool for the rental website.
; Copy to /etc/php/8.3/fpm/pool.d/rental.conf, then: systemctl restart php8.3-fpm
;
; The site runs as the same user that owns the code and runs cron/CLI
; (deploy), so photos uploaded through the website, logs, sessions and
; backups can all be read, rotated and deleted by cron.php and backup.php.
; Nginx (www-data) only talks to the socket.
[rental]
user = deploy
group = deploy
listen = /run/php/rental.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Keep the app's own error log; never show errors to visitors.
php_admin_flag[display_errors] = off
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 70M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
