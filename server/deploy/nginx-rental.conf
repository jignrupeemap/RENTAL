# Nginx site for the rental website on an Ubuntu VPS (Hostinger KVM).
# Copy to /etc/nginx/sites-available/rental, replace example.com, then
#   ln -s /etc/nginx/sites-available/rental /etc/nginx/sites-enabled/rental
#   nginx -t && systemctl reload nginx
# Certbot (sudo certbot --nginx -d example.com -d www.example.com) adds the
# HTTPS server block and the HTTP → HTTPS redirect to this file by itself.
# Same rules as server/public/.htaccess and server/public/uploads/.htaccess.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Only server/public is reachable; app/, config/, storage/ ... are not.
    root /var/www/rental/server/public;
    index index.php;

    # Matches upload_max_filesize 64M / post_max_size 70M (video uploads).
    client_max_body_size 70M;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # Dotfiles (.git, .htaccess ...) except .well-known (certbot).
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Never serve these even if they end up in the web root by mistake.
    location ~* \.(sql|log|ini|sh|bak|dist|lock|md|json|yml|env)$ {
        deny all;
    }

    # Uploaded media: only the file names the upload pipeline writes,
    # never PHP. ^~ stops the \.php$ block below from ever matching here.
    location ^~ /uploads/ {
        location ~* "^/uploads/[a-z0-9_-]+/(\d+/)*[a-f0-9]{32}(_[a-z]+)?\.(webp|jpe?g|png|mp4|webm)$" {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        return 403;
    }

    # Our CSS/JS carry ?v=mtime (asset()), so they can be cached for a year.
    location ~* \.(webp|jpe?g|png|svg|ico|css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything that is not a real file goes to the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller runs; any other .php under public/ is refused.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/rental.sock;   # pool from deploy/php-fpm-rental.conf
        fastcgi_read_timeout 120s;
    }
    location ~ \.php$ {
        return 404;
    }
}
