; PHP settings for the rental website (PHP-FPM and CLI).
; Copy to /etc/php/8.3/fpm/conf.d/99-rental.ini and
;         /etc/php/8.3/cli/conf.d/99-rental.ini, then: systemctl restart php8.3-fpm
upload_max_filesize = 64M
post_max_size = 70M
memory_limit = 256M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC
; Session files live in the app (storage/sessions); keep PHP's own GC on.
session.gc_probability = 1
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
